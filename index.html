    <!-- Script de splash INMEDIATO -->
    <script>
        (function() {
            function initSplash() {
                console.log('🎬 Iniciando splash...');
                setTimeout(function() {
                    console.log('⏳ Ocultando splash (2s)');
                    var splash = document.getElementById('splashScreen');
                    if (splash) splash.classList.add('hide');
                    
                    setTimeout(function() {
                        console.log('🌊 Activando wave (2.1s)');
                        var wave = document.getElementById('wave');
                        if (wave) wave.classList.add('active');
                        
                        setTimeout(function() {
                            console.log('🔐 Mostrando auth (2.6s)');
                            var auth = document.getElementById('authContainer');
                            if (auth) {
                                auth.classList.add('show');
                                if (window.Auth && Auth.renderLogin) {
                                    Auth.renderLogin();
                                }
                            }
                            
                            setTimeout(function() {
                                console.log('✅ Wave completada (3.2s)');
                                if (wave) wave.classList.remove('active');
                            }, 600);
                            
                        }, 500);
                        
                    }, 100);
                    
                }, 2000);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSplash);
            } else {
                setTimeout(initSplash, 100);
            }
        })();
    </script>
</head>
<body>

    <!-- ✅ Registrar Service Worker con actualización automática -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
                    .then((registration) => {
                        console.log('✅ Service Worker registrado:', registration.scope);
                        
                        setInterval(() => {
                            registration.update();
                        }, 60 * 60 * 1000);
                        
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('🔄 Nueva versión detectada');
                            
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log(' Nueva versión lista, actualizando...');
                                    
                                    if (window.App && window.App.showToast) {
                                        window.App.showToast('🔄 Actualizando app...');
                                    }
                                    
                                    setTimeout(() => {
                                        window.location.reload();
                                    }, 2000);
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
                
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    console.log('🔄 Service Worker cambiado, recargando...');
                    window.location.reload();
                });
            });
        }
    </script>

    <!-- ✅ SCRIPT: Botón ojito para ver contraseña -->
    <script>
    (function() {
        function agregarBotonOjito() {
            const inputsPassword = document.querySelectorAll('input[type="password"]');
            
            inputsPassword.forEach(input => {
                if (input.parentElement.classList.contains('password-wrapper')) return;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'password-wrapper';
                
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);
                
                const btnOjo = document.createElement('button');
                btnOjo.type = 'button';
                btnOjo.className = 'btn-ver-password';
                btnOjo.setAttribute('aria-label', 'Ver contraseña');
                btnOjo.innerHTML = `
                    <svg class="icono-ojo-cerrado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                    <svg class="icono-ojo-abierto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                `;
                
                wrapper.appendChild(btnOjo);
                
                btnOjo.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const esPassword = input.type === 'password';
                    input.type = esPassword ? 'text' : 'password';
                    
                    const ojoCerrado = btnOjo.querySelector('.icono-ojo-cerrado');
                    const ojoAbierto = btnOjo.querySelector('.icono-ojo-abierto');
                    
                    if (esPassword) {
                        ojoCerrado.style.display = 'none';
                        ojoAbierto.style.display = 'block';
                    } else {
                        ojoCerrado.style.display = 'block';
                        ojoAbierto.style.display = 'none';
                    }
                });
            });
        }
        
        agregarBotonOjito();
        
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.addedNodes.length > 0) {
                    setTimeout(agregarBotonOjito, 100);
                }
            });
        });
        
        observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
