<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#9B7FD4">
    <meta name="description" content="Aplicación de gestión inteligente de roles y horarios">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CICLO">
    <title>CICLO</title>
    
    <!-- PWA Manifest e Iconos -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="/assets/icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/icon-192.png">
    
    <!-- iOS Splash Screen -->
    <link rel="apple-touch-startup-image" href="/assets/splash.png">

    <link rel="stylesheet" href="/styles.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- INICIALIZACIÓN INMEDIATA DE FIREBASE -->
    <script>
        if (typeof firebase === 'undefined') {
            console.error('❌ Firebase SDK no cargó');
        } else {
            const firebaseConfig = {
                apiKey: "AIzaSyBeH3eFUPeUmis1fUUDOIgK6--69p-WkEM",
                authDomain: "ciclo-db5c9.firebaseapp.com",
                projectId: "ciclo-db5c9",
                storageBucket: "ciclo-db5c9.firebasestorage.app",
                messagingSenderId: "384309494842",
                appId: "1:384309494842:web:b5c113c35877a431462103"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
                console.log('✅ Firebase inicializado correctamente');
            }
            window.firebase = firebase;
        }
    </script>

    <!-- Script de splash CORREGIDO -->
    <script>
        (function() {
            function hideSplash() {
                console.log('🎬 Ocultando splash...');
                var splash = document.getElementById('splashScreen');
                var wave = document.getElementById('wave');
                var auth = document.getElementById('authContainer');
                var mainApp = document.getElementById('mainApp');
                
                // Ocultar splash inmediatamente
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.transition = 'opacity 0.3s ease';
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 300);
                }
                
                // Mostrar wave
                if (wave) {
                    setTimeout(() => {
                        wave.classList.add('active');
                        setTimeout(() => {
                            wave.classList.remove('active');
                        }, 1500);
                    }, 200);
                }
                
                // Mostrar auth o mainApp
                setTimeout(() => {
                    if (auth) {
                        auth.classList.add('show');
                        if (window.Auth && Auth.renderLogin) {
                            Auth.renderLogin();
                        }
                    }
                    if (mainApp) {
                        mainApp.classList.add('show');
                    }
                }, 500);
            }

            // Ejecutar cuando el DOM esté listo
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(hideSplash, 500);
                });
            } else {
                setTimeout(hideSplash, 500);
            }
        })();
    </script>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splashScreen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg,#F0E6F6);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.3s ease;">
        <div class="splash-logo" style="width:120px;height:120px;background:var(--primary,#9B7FD4);border-radius:30px;display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 10px 40px rgba(155,127,212,0.4);">
            <svg viewBox="0 0 24 24" style="width:60px;height:60px;stroke:white;fill:none;stroke-width:2;" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                <polyline points="21 3 21 9 15 9"/>
            </svg>
        </div>
        <div class="splash-title" style="font-size:32px;font-weight:bold;color:var(--text,#3D2E5C);margin-bottom:8px;">CICLO</div>
        <div class="splash-subtitle" style="font-size:14px;color:var(--text-soft,#7A6B8E);">Gestión inteligente</div>
    </div>

    <!-- WAVE TRANSITION -->
    <div class="wave-container" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;">
        <div class="wave" id="wave" style="position:absolute;top:0;left:0;width:100%;height:100%;background:var(--primary,#9B7FD4);transform:translateY(100%);transition:transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);">
            <svg viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="position:absolute;top:0;left:0;width:100%;height:100%;">
                <path class="wave-bg" d="M0,0 L1440,0 L1440,450 C1200,550 960,350 720,500 C480,650 240,400 0,550 Z" fill="var(--bg,#F0E6F6)"/>
            </svg>
        </div>
    </div>

    <!-- AUTH CONTAINER -->
    <div id="authContainer" style="display:none;"></div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display:none;">
        <header class="app-header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="header-title wave-title">CICLO</span>
            </div>
        </header>

        <div class="app-content" id="viewContainer"></div>

        <!-- SIDE MENU -->
        <div class="side-menu-overlay" id="menuOverlay"></div>
        <nav class="side-menu" id="sideMenu">
            <div class="side-menu-header">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="user-name" id="menuUserName">Usuario</div>
                <div class="user-email" id="menuUserEmail">usuario@correo.com</div>
            </div>
            <div class="side-menu-nav" id="sideMenuNav"></div>
            <div class="side-menu-footer">
                <button class="btn-logout" id="btnLogout">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>
        </nav>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <!-- Scripts base -->
    <script src="/db.js"></script>
    <script src="/auth.js"></script>
    <script type="module" src="/app.js"></script>

    <!-- Registrar Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('✅ Service Worker registrado:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
