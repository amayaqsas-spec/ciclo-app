<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#9B7FD4">
    <meta name="description" content="Aplicación de gestión inteligente de roles y horarios">
    
    <!-- ✅ OPTIMIZACIÓN iOS: Prevenir render blocking -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CICLO">
    <meta name="format-detection" content="telephone=no">
    
    <!-- ✅ Prevenir caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>CICLO</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192.png">

    <!-- ✅ CSS cargado de forma no-blocking -->
    <link rel="stylesheet" href="styles.css" media="all">

    <!-- ✅ Firebase SDK cargado con defer -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>

    <!-- ✅ INICIALIZACIÓN FIREBASE (solo cuando esté listo) -->
    <script>
        window.addEventListener('load', function() {
            if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length === 0) {
                const firebaseConfig = {
                    apiKey: "AIzaSyBeH3eFUPeUmis1fUUDOIgK6--69p-WkEM",
                    authDomain: "ciclo-db5c9.firebaseapp.com",
                    projectId: "ciclo-db5c9",
                    storageBucket: "ciclo-db5c9.firebasestorage.app",
                    messagingSenderId: "384309494842",
                    appId: "1:384309494842:web:b5c113c35877a431462103"
                };
                firebase.initializeApp(firebaseConfig);
                console.log('✅ Firebase inicializado');
                window.firebase = firebase;
            }
        });
    </script>

    <!-- ✅ Service Worker ligero (sin bucle) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('✅ SW registrado');
                        // Verificar actualizaciones cada 10 minutos (no 5)
                        setInterval(() => reg.update(), 10 * 60 * 1000);
                    })
                    .catch(err => console.log('SW error:', err));
            });
        }
    </script>

    <!-- ✅ Splash screen mínimo -->
    <script>
        (function() {
            function initSplash() {
                setTimeout(function() {
                    var splash = document.getElementById('splashScreen');
                    if (splash) splash.classList.add('hide');
                    
                    setTimeout(function() {
                        var wave = document.getElementById('wave');
                        if (wave) wave.classList.add('active');
                        
                        setTimeout(function() {
                            var auth = document.getElementById('authContainer');
                            if (auth) {
                                auth.classList.add('show');
                                if (window.Auth && Auth.renderLogin) Auth.renderLogin();
                            }
                            setTimeout(function() {
                                if (wave) wave.classList.remove('active');
                            }, 600);
                        }, 500);
                    }, 100);
                }, 1500); // Reducido de 2000 a 1500
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSplash);
            } else {
                setTimeout(initSplash, 100);
            }
        })();
    </script>
    
    <!-- ✅ CSS crítico inline para renderizado inmediato en iOS -->
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #splashScreen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #F0E6F6 0%, #E8D5F5 100%); z-index: 10000; transition: opacity 0.3s; }
        #splashScreen.hide { opacity: 0; pointer-events: none; }
        .splash-title { font-size: 48px; font-weight: 800; color: #9B7FD4; letter-spacing: 4px; margin-top: 20px; }
        .splash-subtitle { color: #7A6B8E; font-size: 16px; }
        #authContainer { display: none; }
        #authContainer.show { display: block; }
        #mainApp { display: none; }
        #mainApp.show { display: block; }
        /* ✅ Aceleración GPU para iOS */
        .view, .ske-greeting-card, .auth-card { will-change: transform; -webkit-transform: translateZ(0); transform: translateZ(0); }
    </style>
</head>
<body>

    <div id="splashScreen">
        <div class="splash-logo">
            <svg viewBox="0 0 24 24" width="80" height="80" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 12a9 9 0 1 1-6.219-8.56" fill="none" stroke="#9B7FD4" stroke-width="2"/>
                <polyline points="21 3 21 9 15 9" fill="none" stroke="#9B7FD4" stroke-width="2"/>
            </svg>
        </div>
        <div class="splash-title">CICLO</div>
        <div class="splash-subtitle">Gestión inteligente</div>
    </div>

    <div class="wave-container">
        <div class="wave" id="wave">
            <svg viewBox="0 0 1440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <path class="wave-bg" d="M0,0 L1440,0 L1440,450 C1200,550 960,350 720,500 C480,650 240,400 0,550 Z"/>
            </svg>
        </div>
    </div>

    <div id="authContainer"></div>

    <div id="mainApp">
        <header class="app-header">
            <div class="header-left">
                <button class="menu-btn" id="menuBtn">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <span class="header-title wave-title">CICLO</span>
            </div>
            <button class="header-bell" id="btnNotificaciones" title="Documentos nuevos">
                <svg viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <span class="bell-badge" id="bellBadge" style="display:none;">0</span>
            </button>
        </header>

        <div class="app-content" id="viewContainer"></div>

        <div class="side-menu-overlay" id="menuOverlay"></div>
        <nav class="side-menu" id="sideMenu">
            <div class="side-menu-header">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="user-name" id="menuUserName">Usuario</div>
                <div class="user-email" id="menuUserEmail">usuario@correo.com</div>
            </div>
            <div class="side-menu-nav" id="sideMenuNav"></div>
            <div class="side-menu-footer">
                <button class="btn-logout" id="btnLogout">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Cerrar Sesión
                </button>
            </div>
        </nav>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ✅ Scripts base cargados al final -->
    <script src="db.js"></script>
    <script src="auth.js"></script>
    <script type="module" src="app.js"></script>

    <!-- ✅ Botón ojito (ligero) -->
    <script>
    (function() {
        function agregarBotonOjito() {
            const inputsPassword = document.querySelectorAll('input[type="password"]');
            inputsPassword.forEach(input => {
                if (input.parentElement.classList.contains('password-wrapper')) return;
                const wrapper = document.createElement('div');
                wrapper.className = 'password-wrapper';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);
                const btnOjo = document.createElement('button');
                btnOjo.type = 'button';
                btnOjo.className = 'btn-ver-password';
                btnOjo.setAttribute('aria-label', 'Ver contraseña');
                btnOjo.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
                wrapper.appendChild(btnOjo);
                btnOjo.addEventListener('click', function(e) {
                    e.preventDefault();
                    input.type = input.type === 'password' ? 'text' : 'password';
                });
            });
        }
        agregarBotonOjito();
        const observer = new MutationObserver(mutations => {
            mutations.forEach(m => {
                if (m.addedNodes.length > 0) setTimeout(agregarBotonOjito, 100);
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
</body>
</html>
